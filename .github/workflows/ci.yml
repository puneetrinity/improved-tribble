name: Flow CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VantaHireWebsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VantaHireWebsite/package-lock.json
      - run: npm ci
      - run: npm run check:server
      - run: npm run check:client
      - run: npm run test:server
