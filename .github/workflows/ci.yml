name: Flow CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  sourcing-production-collation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        locale: ['C', 'en_US.utf8']
    defaults:
      run:
        working-directory: VantaHireWebsite
    env:
      PGHOST: 127.0.0.1
      PGPORT: '55489'
      PGUSER: postgres
      PGPASSWORD: local-test-only
      FLOW_SOURCING_DISPOSABLE: '1'
      FLOW_SOURCING_EXPECT_LOCALE: ${{ matrix.locale }}
      FLOW_SOURCING_OWNER_URL: postgresql://flow_collation_owner_test:local-test-only@127.0.0.1:55489/flow_collation_test
      FLOW_SOURCING_CONCURRENCY_URL: postgresql://flow_collation_owner_test:local-test-only@127.0.0.1:55489/flow_collation_concurrency_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VantaHireWebsite/package-lock.json
      - run: npm ci
      - name: Create isolated restricted owner databases
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common ca-certificates locales
          . /etc/os-release
          pg_keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          if [ ! -r "$pg_keyring" ]; then
            pg_keyring=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          fi
          test -r "$pg_keyring"
          printf 'deb [signed-by=%s] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$pg_keyring" "${VERSION_CODENAME:?}" | sudo tee /etc/apt/sources.list.d/wave5b-pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-17
          sudo locale-gen en_US.UTF-8
          /usr/lib/postgresql/17/bin/initdb -D "$RUNNER_TEMP/wave5b-pg17" -U postgres --auth-local=trust --auth-host=trust --locale="$FLOW_SOURCING_EXPECT_LOCALE" --encoding=UTF8
          /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/wave5b-pg17" -l "$RUNNER_TEMP/wave5b-pg17.log" -o "-h 127.0.0.1 -k $RUNNER_TEMP -p 55489 -c shared_buffers=32MB -c max_connections=30 -c max_parallel_workers=0" -w start
          psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE flow_collation_owner_test LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'local-test-only';
          CREATE DATABASE flow_collation_test OWNER flow_collation_owner_test;
          CREATE DATABASE flow_collation_concurrency_test OWNER flow_collation_owner_test;
          SQL
      - run: npm run test:sourcing-authority:pg
      - name: Stop owned PostgreSQL 17
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/wave5b-pg17/postmaster.pid"; then
            /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/wave5b-pg17" -m fast -w stop
          fi
  server-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: postgresql://flow_test:flow_test@127.0.0.1:5432/flow_test
      FLOW_POSTGRES_TEST_URL: postgresql://flow_test:flow_test@127.0.0.1:5432/flow_test
      DATABASE_SSL: 'false'
    defaults:
      run:
        working-directory: VantaHireWebsite
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VantaHireWebsite/package-lock.json
      - name: Start runner-local PostgreSQL 16 and prepare test identities
        run: |
          sudo systemctl start postgresql
          server_version_num="$(sudo -u postgres psql -d postgres -Atqc 'SHOW server_version_num')"
          if [[ "$server_version_num" != 16* ]]; then
            echo "Expected runner-local PostgreSQL 16; got server_version_num=$server_version_num" >&2
            exit 1
          fi
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS flow_schema_control_test_ci WITH (FORCE);
          DROP DATABASE IF EXISTS flow_test WITH (FORCE);
          DROP ROLE IF EXISTS flow_schema_control_test_runtime;
          DROP ROLE IF EXISTS flow_schema_control_test_runner;
          DROP ROLE IF EXISTS flow_test;
          CREATE ROLE flow_test LOGIN SUPERUSER PASSWORD 'flow_test';
          CREATE DATABASE flow_test OWNER flow_test;
          CREATE ROLE flow_schema_control_test_runner LOGIN SUPERUSER PASSWORD 'runner-test-only';
          CREATE ROLE flow_schema_control_test_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'runtime-test-only';
          CREATE DATABASE flow_schema_control_test_ci OWNER flow_schema_control_test_runner;
          SQL
          pg_isready -h 127.0.0.1 -p 5432 -d flow_test -U flow_test
      - run: npm ci
      - run: npm run check:schema-control
      - run: npm run check:candidate-privacy-surfaces
      - run: npm run check:object-authorization
      - run: npm run check:organization-candidate-intake
      - run: npm run check:candidate-consent
      - run: npm run check:candidate-index
      - run: npm run check:candidate-history
      - run: node scripts/check-resume-ingest-ocr.mjs
      - run: npm run check:job-brief
      - run: npm run check:sourcing-authority
      - run: npm run check:server
      - run: npm run check:client
      - run: npm run test:server
      - run: npm run test:candidate-consent
      - run: npm run test:candidate-index
      - run: npm run test:candidate-history
      - run: npm run test:job-brief
      - run: npm run test:job-brief:client
      - run: npm run test:sourcing-authority
      - run: npm run test:sourcing-authority:client
      - run: npm run test:candidate-consent:client
      - run: npm run test:candidate-index:client
      - name: Run disposable schema-control matrix
        env:
          NODE_ENV: test
          FLOW_SCHEMA_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:schema-control:pg
      - name: Run governed sourcing against a fresh restricted owner
        env:
          FLOW_SOURCING_DISPOSABLE: '1'
          FLOW_SOURCING_OWNER_URL: postgresql://flow_sourcing_owner_test:sourcing-test-only@127.0.0.1:5432/flow_sourcing_test
          FLOW_SOURCING_CONCURRENCY_URL: postgresql://flow_sourcing_owner_test:sourcing-test-only@127.0.0.1:5432/flow_sourcing_concurrency_test
        run: |
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE flow_sourcing_owner_test LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD 'sourcing-test-only';
          CREATE DATABASE flow_sourcing_test OWNER flow_sourcing_owner_test;
          CREATE DATABASE flow_sourcing_concurrency_test OWNER flow_sourcing_owner_test;
          SQL
          npm run test:sourcing-authority:pg
      - name: Run disposable candidate-privacy matrix
        env:
          NODE_ENV: test
          FLOW_SCHEMA_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:candidate-privacy:pg
      - name: Run disposable object-authorization matrix
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:object-authorization:pg
      - name: Run versioned invitation-grant PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:versioned-invitation-grants:pg
      - name: Run unsafe organization-attribution retirement PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:unsafe-org-attribution-retirement:pg
      - name: Run decision-event spine PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:decision-event-spine:pg
      - name: Run decision-projection outbox PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:decision-projection-outbox:pg
      - name: Run decision-projection delivery PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:decision-projection-delivery:pg
      - name: Run organization-private candidate intake PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:organization-candidate-intake:pg
      - name: Run candidate-consent PostgreSQL lifecycle alone
        env:
          NODE_ENV: test
          FLOW_AUTHZ_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@127.0.0.1:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@127.0.0.1:5432/flow_schema_control_test_ci
        run: npm run test:candidate-consent:pg
      - name: Run candidate-index schema and release proof with fresh restricted identities
        env:
          NODE_ENV: test
          FLOW_INDEX_TEST_DISPOSABLE: '1'
          FLOW_INDEX_TEST_OWNER_URL: postgresql://flow_4d_test_owner:index-owner-fixture@127.0.0.1:5432/flow_4d_test_fresh
          FLOW_INDEX_TEST_RUNTIME_URL: postgresql://flow_4d_test_runtime:index-runtime-fixture@127.0.0.1:5432/flow_4d_test_fresh
          FLOW_INDEX_TEST_READONLY_URL: postgresql://flow_4d_test_readonly:index-readonly-fixture@127.0.0.1:5432/flow_4d_test_fresh
        run: |
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE flow_4d_test_owner LOGIN CREATEROLE NOINHERIT PASSWORD 'index-owner-fixture';
          CREATE ROLE flow_4d_test_runtime LOGIN NOINHERIT PASSWORD 'index-runtime-fixture';
          CREATE ROLE flow_4d_test_readonly LOGIN NOINHERIT PASSWORD 'index-readonly-fixture';
          GRANT flow_4d_test_runtime TO flow_4d_test_owner WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
          CREATE DATABASE flow_4d_test_fresh OWNER flow_4d_test_owner;
          REVOKE TEMPORARY ON DATABASE flow_4d_test_fresh FROM PUBLIC;
          GRANT TEMPORARY ON DATABASE flow_4d_test_fresh TO flow_4d_test_owner,flow_4d_test_runtime;
          ALTER ROLE flow_4d_test_readonly SET default_transaction_read_only=on;
          SQL
          npm run test:candidate-index:pg
      - name: Run keyed private-history reader PostgreSQL proof
        env:
          NODE_ENV: test
          FLOW_HISTORY_TEST_DISPOSABLE: '1'
          FLOW_HISTORY_TEST_OWNER_URL: postgresql://flow_4d_test_owner:index-owner-fixture@127.0.0.1:5432/flow_4d_test_fresh
          FLOW_HISTORY_TEST_RUNTIME_URL: postgresql://flow_4d_test_runtime:index-runtime-fixture@127.0.0.1:5432/flow_4d_test_fresh
        run: npm run test:candidate-history:pg
      - name: Run job-brief release and restricted-authority PostgreSQL proof
        env:
          NODE_ENV: test
          FLOW_BRIEF_DISPOSABLE: '1'
          FLOW_BRIEF_OWNER_URL: postgresql://flow_brief_owner_test:brief-owner-fixture@127.0.0.1:5432/flow_brief_fixture_test
          FLOW_BRIEF_RUNTIME_URL: postgresql://flow_brief_runtime_test:brief-runtime-fixture@127.0.0.1:5432/flow_brief_fixture_test
        run: |
          sudo -u postgres psql -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE flow_brief_owner_test LOGIN CREATEROLE NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'brief-owner-fixture';
          CREATE ROLE flow_brief_runtime_test LOGIN NOINHERIT NOSUPERUSER NOBYPASSRLS PASSWORD 'brief-runtime-fixture';
          GRANT flow_brief_runtime_test TO flow_brief_owner_test WITH ADMIN TRUE, INHERIT FALSE, SET FALSE;
          CREATE DATABASE flow_brief_fixture_test OWNER flow_brief_owner_test;
          SQL
          npm run test:job-brief:pg
