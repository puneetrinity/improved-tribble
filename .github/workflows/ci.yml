name: Flow CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  server-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flow_test
          POSTGRES_PASSWORD: flow_test
          POSTGRES_DB: flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flow_test -d flow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://flow_test:flow_test@localhost:5432/flow_test
      FLOW_POSTGRES_TEST_URL: postgresql://flow_test:flow_test@localhost:5432/flow_test
      DATABASE_SSL: 'false'
    defaults:
      run:
        working-directory: VantaHireWebsite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: VantaHireWebsite/package-lock.json
      - run: npm ci
      - run: npm run check:schema-control
      - run: npm run check:server
      - run: npm run check:client
      - run: npm run test:server
      - name: Prepare disposable schema-control database and roles
        env:
          PGPASSWORD: flow_test
        run: |
          psql -h localhost -U flow_test -d flow_test -v ON_ERROR_STOP=1 <<'SQL'
          DROP DATABASE IF EXISTS flow_schema_control_test_ci WITH (FORCE);
          DROP ROLE IF EXISTS flow_schema_control_test_runtime;
          DROP ROLE IF EXISTS flow_schema_control_test_runner;
          CREATE ROLE flow_schema_control_test_runner LOGIN SUPERUSER PASSWORD 'runner-test-only';
          CREATE ROLE flow_schema_control_test_runtime LOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'runtime-test-only';
          CREATE DATABASE flow_schema_control_test_ci OWNER flow_schema_control_test_runner;
          SQL
      - name: Run disposable schema-control matrix
        env:
          NODE_ENV: test
          FLOW_SCHEMA_TEST_DISPOSABLE: '1'
          FLOW_SCHEMA_TEST_DATABASE_URL: postgresql://flow_schema_control_test_runner:runner-test-only@localhost:5432/flow_schema_control_test_ci
          FLOW_SCHEMA_TEST_RUNTIME_DATABASE_URL: postgresql://flow_schema_control_test_runtime:runtime-test-only@localhost:5432/flow_schema_control_test_ci
        run: npm run test:schema-control:pg
